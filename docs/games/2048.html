<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 Puzzle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 16px;
    }
    .game-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      width: 360px;
      max-width: 100%;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .title {
      font-size: 32px;
      font-weight: 800;
      color: #fbbf24;
      line-height: 1;
    }
    .scores {
      display: flex;
      gap: 8px;
    }
    .score-badge {
      background: #1e293b;
      border-radius: 6px;
      padding: 4px 10px;
      text-align: center;
      min-width: 64px;
    }
    .score-badge span {
      display: block;
      font-size: 10px;
      color: #94a3b8;
      font-weight: bold;
      text-transform: uppercase;
    }
    .score-badge b {
      font-size: 15px;
      color: #f8fafc;
      font-family: monospace;
    }
    .grid-container {
      position: relative;
      background: #1e293b;
      border-radius: 8px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
      aspect-ratio: 1 / 1;
      width: 100%;
    }
    .tile-slot {
      background: #0f172a;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      transition: all 0.1s ease-in-out;
    }
    .tile-2    { background: #334155; color: #f8fafc; }
    .tile-4    { background: #475569; color: #f8fafc; }
    .tile-8    { background: #f97316; color: #ffffff; }
    .tile-16   { background: #ea580c; color: #ffffff; }
    .tile-32   { background: #ef4444; color: #ffffff; }
    .tile-64   { background: #dc2626; color: #ffffff; }
    .tile-128  { background: #eab308; color: #ffffff; font-size: 20px; box-shadow: 0 0 10px rgba(234,179,8,0.4); }
    .tile-256  { background: #f59e0b; color: #ffffff; font-size: 20px; box-shadow: 0 0 12px rgba(245,158,11,0.5); }
    .tile-512  { background: #10b981; color: #ffffff; font-size: 20px; box-shadow: 0 0 14px rgba(16,185,129,0.5); }
    .tile-1024 { background: #06b6d4; color: #ffffff; font-size: 17px; box-shadow: 0 0 16px rgba(6,182,212,0.6); }
    .tile-2048 { background: #8b5cf6; color: #ffffff; font-size: 17px; box-shadow: 0 0 20px rgba(139,92,246,0.8); }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      font-size: 12px;
      color: #64748b;
    }
    .btn {
      background: #fbbf24;
      color: #451a03;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:hover { background: #f59e0b; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 5;
    }
    .overlay.hidden { display: none; }
  </style>
</head>
<body>
  <div class="game-card">
    <div class="header">
      <div class="title">2048</div>
      <div class="scores">
        <div class="score-badge">
          <span>SCORE</span>
          <b id="score">0</b>
        </div>
        <div class="score-badge">
          <span>BEST</span>
          <b id="best">0</b>
        </div>
      </div>
    </div>

    <div class="grid-container" id="grid">
      <!-- 16 slots -->
      <div class="overlay hidden" id="gameOverlay">
        <h2 id="overlayTitle" style="font-size: 24px; color: #f87171;">GAME OVER</h2>
        <button id="overlayBtn" class="btn" style="padding: 8px 20px;">TRY AGAIN</button>
      </div>
    </div>

    <div class="footer">
      <span>Use <b>Arrow Keys</b> or <b>WASD</b></span>
      <button class="btn" id="newGameBtn">NEW GAME</button>
    </div>
  </div>

  <script>
    const gridEl = document.getElementById('grid');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const newGameBtn = document.getElementById('newGameBtn');
    const gameOverlay = document.getElementById('gameOverlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayBtn = document.getElementById('overlayBtn');

    let board = Array(4).fill(null).map(() => Array(4).fill(0));
    let score = 0;
    let best = parseInt(localStorage.getItem('2048_best') || '0', 10);
    bestEl.textContent = best;

    function init() {
      board = Array(4).fill(null).map(() => Array(4).fill(0));
      score = 0;
      scoreEl.textContent = score;
      gameOverlay.classList.add('hidden');
      addRandomTile();
      addRandomTile();
      render();
    }

    function addRandomTile() {
      const empty = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (board[r][c] === 0) empty.push({ r, c });
        }
      }
      if (empty.length > 0) {
        const spot = empty[Math.floor(Math.random() * empty.length)];
        board[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function render() {
      // Remove old tile divs except overlay
      const oldTiles = gridEl.querySelectorAll('.tile-slot');
      oldTiles.forEach(t => t.remove());

      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const val = board[r][c];
          const div = document.createElement('div');
          div.className = `tile-slot ${val ? 'tile-' + (val > 2048 ? 2048 : val) : ''}`;
          div.textContent = val || '';
          gridEl.appendChild(div);
        }
      }
    }

    function slide(row) {
      let arr = row.filter(val => val);
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2;
          score += arr[i];
          arr[i + 1] = 0;
        }
      }
      arr = arr.filter(val => val);
      while (arr.length < 4) arr.push(0);
      return arr;
    }

    function moveLeft() {
      let changed = false;
      for (let r = 0; r < 4; r++) {
        const oldRow = [...board[r]];
        board[r] = slide(board[r]);
        if (board[r].some((val, idx) => val !== oldRow[idx])) changed = true;
      }
      return changed;
    }

    function moveRight() {
      let changed = false;
      for (let r = 0; r < 4; r++) {
        const oldRow = [...board[r]];
        board[r] = slide(board[r].reverse()).reverse();
        if (board[r].some((val, idx) => val !== oldRow[idx])) changed = true;
      }
      return changed;
    }

    function moveUp() {
      let changed = false;
      for (let c = 0; c < 4; c++) {
        const oldCol = [board[0][c], board[1][c], board[2][c], board[3][c]];
        const newCol = slide(oldCol);
        for (let r = 0; r < 4; r++) {
          if (board[r][c] !== newCol[r]) changed = true;
          board[r][c] = newCol[r];
        }
      }
      return changed;
    }

    function moveDown() {
      let changed = false;
      for (let c = 0; c < 4; c++) {
        const oldCol = [board[0][c], board[1][c], board[2][c], board[3][c]];
        const newCol = slide(oldCol.reverse()).reverse();
        for (let r = 0; r < 4; r++) {
          if (board[r][c] !== newCol[r]) changed = true;
          board[r][c] = newCol[r];
        }
      }
      return changed;
    }

    function canMove() {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (board[r][c] === 0) return true;
          if (c < 3 && board[r][c] === board[r][c + 1]) return true;
          if (r < 3 && board[r][c] === board[r + 1][c]) return true;
        }
      }
      return false;
    }

    function handleKey(e) {
      const key = e.key.toLowerCase();
      let moved = false;
      if (key === 'arrowleft' || key === 'a') moved = moveLeft();
      else if (key === 'arrowright' || key === 'd') moved = moveRight();
      else if (key === 'arrowup' || key === 'w') moved = moveUp();
      else if (key === 'arrowdown' || key === 's') moved = moveDown();

      if (moved) {
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem('2048_best', best);
        }
        addRandomTile();
        render();

        if (!canMove()) {
          overlayTitle.textContent = "GAME OVER";
          gameOverlay.classList.remove('hidden');
        }
      }
    }

    window.addEventListener('keydown', e => {
      if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
      handleKey(e);
    });

    newGameBtn.onclick = init;
    overlayBtn.onclick = init;

    init();
  </script>
</body>
</html>
