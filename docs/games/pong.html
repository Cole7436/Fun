<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Pong</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 16px;
    }
    .game-card {
      position: relative;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
    }
    .scores {
      font-family: monospace;
      font-size: 20px;
      color: #38bdf8;
      display: flex;
      gap: 16px;
    }
    canvas {
      background: #030712;
      border-radius: 8px;
      border: 1px solid #1e293b;
      display: block;
    }
    .hint {
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    .overlay {
      position: absolute;
      inset: 60px 16px 45px 16px;
      background: rgba(3, 7, 18, 0.92);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      gap: 12px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #38bdf8;
      color: #082f49;
      font-weight: 700;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <div class="game-card">
    <div class="top-bar">
      <div>PLAYER 1 (YOU)</div>
      <div class="scores"><span id="p1Score">0</span> : <span id="p2Score">0</span></div>
      <div>AI OPPONENT</div>
    </div>

    <canvas id="canvas" width="500" height="340"></canvas>

    <div class="hint">
      <span>Player 1: <b>W / S</b> or <b>↑ / ↓</b> or <b>Mouse</b></span>
      <span>First to 7 wins!</span>
    </div>

    <div id="startOverlay" class="overlay">
      <h2 style="font-size: 24px; color: #38bdf8; margin-bottom: 4px;">ARCADE PONG</h2>
      <p style="color: #94a3b8; font-size: 13px;">Classic table tennis duel against intelligent AI paddle.</p>
      <button id="startBtn" class="btn">START MATCH</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
      <h2 id="winnerText" style="font-size: 22px; color: #38bdf8; margin-bottom: 4px;">VICTORY!</h2>
      <button id="restartBtn" class="btn" style="margin-top: 8px;">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const p1ScoreEl = document.getElementById('p1Score');
    const p2ScoreEl = document.getElementById('p2Score');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const winnerText = document.getElementById('winnerText');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    const paddleWidth = 10;
    const paddleHeight = 70;
    let p1Y = (canvas.height - paddleHeight) / 2;
    let p2Y = (canvas.height - paddleHeight) / 2;
    let p1Score = 0;
    let p2Score = 0;

    let ballX = canvas.width / 2;
    let ballY = canvas.height / 2;
    let ballRadius = 6;
    let ballDx = 4;
    let ballDy = 2;

    let isPlaying = false;
    let animId = null;

    let audioCtx = null;
    function beep(f, dur = 0.05) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(f, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function resetBall(direction = 1) {
      ballX = canvas.width / 2;
      ballY = canvas.height / 2;
      const angle = (Math.random() * 0.8 - 0.4);
      const speed = 4.5;
      ballDx = Math.cos(angle) * speed * direction;
      ballDy = Math.sin(angle) * speed;
    }

    function update() {
      if (!isPlaying) return;

      ballX += ballDx;
      ballY += ballDy;

      // Top / bottom bounce
      if (ballY - ballRadius < 0 || ballY + ballRadius > canvas.height) {
        ballDy = -ballDy;
        beep(220, 0.03);
      }

      // AI paddle logic
      const targetY = ballY - paddleHeight / 2;
      p2Y += (targetY - p2Y) * 0.085;
      p2Y = Math.max(0, Math.min(canvas.height - paddleHeight, p2Y));

      // Player 1 Paddle Collision
      if (ballX - ballRadius < 20 + paddleWidth && ballX + ballRadius > 20) {
        if (ballY > p1Y && ballY < p1Y + paddleHeight) {
          ballDx = Math.abs(ballDx) * 1.05;
          const hit = (ballY - (p1Y + paddleHeight / 2)) / (paddleHeight / 2);
          ballDy = hit * 4.5;
          beep(440, 0.05);
        }
      }

      // Player 2 Paddle Collision
      if (ballX + ballRadius > canvas.width - 20 - paddleWidth && ballX - ballRadius < canvas.width - 20) {
        if (ballY > p2Y && ballY < p2Y + paddleHeight) {
          ballDx = -Math.abs(ballDx) * 1.05;
          const hit = (ballY - (p2Y + paddleHeight / 2)) / (paddleHeight / 2);
          ballDy = hit * 4.5;
          beep(440, 0.05);
        }
      }

      // Score points
      if (ballX < 0) {
        p2Score++;
        p2ScoreEl.textContent = p2Score;
        beep(180, 0.2);
        checkWin();
        resetBall(1);
      } else if (ballX > canvas.width) {
        p1Score++;
        p1ScoreEl.textContent = p1Score;
        beep(600, 0.15);
        checkWin();
        resetBall(-1);
      }

      draw();
      animId = requestAnimationFrame(update);
    }

    function checkWin() {
      if (p1Score >= 7 || p2Score >= 7) {
        isPlaying = false;
        winnerText.textContent = p1Score >= 7 ? "VICTORY! YOU WON!" : "AI OPPONENT WON!";
        winnerText.style.color = p1Score >= 7 ? "#34d399" : "#f87171";
        gameOverOverlay.classList.remove('hidden');
      }
    }

    function draw() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dashed net
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Paddles
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.roundRect(20, p1Y, paddleWidth, paddleHeight, 4);
      ctx.fill();

      ctx.fillStyle = '#f43f5e';
      ctx.shadowColor = '#f43f5e';
      ctx.beginPath();
      ctx.roundRect(canvas.width - 20 - paddleWidth, p2Y, paddleWidth, paddleHeight, 4);
      ctx.fill();

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function startGame() {
      p1Score = 0;
      p2Score = 0;
      p1ScoreEl.textContent = '0';
      p2ScoreEl.textContent = '0';
      p1Y = (canvas.height - paddleHeight) / 2;
      p2Y = (canvas.height - paddleHeight) / 2;
      resetBall();
      isPlaying = true;
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      cancelAnimationFrame(animId);
      update();
    }

    startBtn.onclick = startGame;
    restartBtn.onclick = startGame;

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const relativeY = e.clientY - rect.top;
      p1Y = Math.max(0, Math.min(canvas.height - paddleHeight, relativeY - paddleHeight / 2));
    });

    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') {
        p1Y = Math.max(0, p1Y - 24);
      } else if (k === 's' || k === 'arrowdown') {
        p1Y = Math.min(canvas.height - paddleHeight, p1Y + 24);
      }
    });

    draw();
  </script>
</body>
</html>
