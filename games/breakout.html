<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brick Breaker DX</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 16px;
    }
    .game-card {
      position: relative;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
    }
    .val {
      color: #f59e0b;
      font-family: monospace;
      font-size: 16px;
    }
    canvas {
      background: #020617;
      border-radius: 8px;
      border: 1px solid #1e293b;
      display: block;
      cursor: none;
    }
    .hint {
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    .overlay {
      position: absolute;
      inset: 60px 16px 45px 16px;
      background: rgba(2, 6, 23, 0.9);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      gap: 12px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #f59e0b;
      color: #451a03;
      font-weight: 700;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #fbbf24; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="game-card">
    <div class="top-bar">
      <div>SCORE: <span id="score" class="val">0</span></div>
      <div>LIVES: <span id="lives" class="val">3</span></div>
      <div>STAGE: <span id="stage" class="val">1</span></div>
    </div>

    <canvas id="canvas" width="460" height="420"></canvas>

    <div class="hint">
      <span>Paddle: <b>Mouse Move</b> or <b>← / →</b></span>
      <span>Launch Ball: <b>Space / Click</b></span>
    </div>

    <div id="startOverlay" class="overlay">
      <h2 style="font-size: 24px; color: #f59e0b; margin-bottom: 4px;">BRICK BREAKER DX</h2>
      <p style="color: #94a3b8; font-size: 13px;">Clear every glowing prism brick with precision ball bounces.</p>
      <button id="startBtn" class="btn">START GAME</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
      <h2 id="endTitle" style="font-size: 22px; color: #f87171; margin-bottom: 4px;">GAME OVER</h2>
      <p style="color: #94a3b8; font-size: 14px;">Final Score: <span id="finalScore" style="color:#f59e0b; font-weight:bold;">0</span></p>
      <button id="restartBtn" class="btn" style="margin-top: 8px;">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const stageEl = document.getElementById('stage');
    const finalScoreEl = document.getElementById('finalScore');
    const endTitle = document.getElementById('endTitle');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let paddleWidth = 80;
    let paddleHeight = 12;
    let paddleX = (canvas.width - paddleWidth) / 2;

    let ballRadius = 6;
    let ballX = canvas.width / 2;
    let ballY = canvas.height - 30;
    let ballDx = 3.5;
    let ballDy = -3.5;
    let ballStuck = true;

    let score = 0;
    let lives = 3;
    let stage = 1;
    let isPlaying = false;
    let animId = null;

    const brickRowCount = 5;
    const brickColumnCount = 8;
    const brickWidth = 46;
    const brickHeight = 16;
    const brickPadding = 8;
    const brickOffsetTop = 30;
    const brickOffsetLeft = 18;

    const rowColors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6'];
    let bricks = [];

    let audioCtx = null;
    function beep(f, dur = 0.06) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function initBricks() {
      bricks = [];
      for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
          bricks[c][r] = { x: 0, y: 0, status: 1, color: rowColors[r] };
        }
      }
    }

    function collisionDetection() {
      let activeCount = 0;
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          const b = bricks[c][r];
          if (b.status === 1) {
            activeCount++;
            if (
              ballX > b.x &&
              ballX < b.x + brickWidth &&
              ballY > b.y &&
              ballY < b.y + brickHeight
            ) {
              ballDy = -ballDy;
              b.status = 0;
              score += (brickRowCount - r) * 20;
              scoreEl.textContent = score;
              beep(300 + (brickRowCount - r) * 70, 0.05);
            }
          }
        }
      }

      if (activeCount === 0) {
        stage++;
        stageEl.textContent = stage;
        initBricks();
        ballStuck = true;
        ballDx = (Math.abs(ballDx) + 0.5) * (Math.random() > 0.5 ? 1 : -1);
        ballDy = -Math.abs(ballDy) - 0.5;
        beep(784, 0.2);
      }
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#f59e0b';
      ctx.shadowBlur = 6;
      ctx.fill();
      ctx.closePath();
      ctx.shadowBlur = 0;
    }

    function drawPaddle() {
      ctx.fillStyle = '#f59e0b';
      ctx.shadowColor = '#f59e0b';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.roundRect(paddleX, canvas.height - paddleHeight - 6, paddleWidth, paddleHeight, 5);
      ctx.fill();
      ctx.closePath();
      ctx.shadowBlur = 0;
    }

    function drawBricks() {
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          if (bricks[c][r].status === 1) {
            const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
            const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;
            ctx.fillStyle = bricks[c][r].color;
            ctx.beginPath();
            ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 3);
            ctx.fill();
            ctx.closePath();
          }
        }
      }
    }

    function update() {
      if (!isPlaying) return;

      if (ballStuck) {
        ballX = paddleX + paddleWidth / 2;
        ballY = canvas.height - paddleHeight - 12;
      } else {
        ballX += ballDx;
        ballY += ballDy;

        // Wall collisions
        if (ballX + ballDx > canvas.width - ballRadius || ballX + ballDx < ballRadius) {
          ballDx = -ballDx;
          beep(240, 0.03);
        }
        if (ballY + ballDy < ballRadius) {
          ballDy = -ballDy;
          beep(240, 0.03);
        } else if (ballY + ballDy > canvas.height - ballRadius - paddleHeight - 6) {
          // Check paddle collision
          if (ballX > paddleX && ballX < paddleX + paddleWidth) {
            // Angle bounce based on hit position
            const hitPoint = (ballX - (paddleX + paddleWidth / 2)) / (paddleWidth / 2);
            const speed = Math.hypot(ballDx, ballDy);
            ballDx = hitPoint * (speed * 0.85);
            ballDy = -Math.sqrt(Math.max(1, speed * speed - ballDx * ballDx));
            beep(420, 0.06);
          } else if (ballY + ballDy > canvas.height - ballRadius) {
            lives--;
            livesEl.textContent = lives;
            beep(150, 0.25);
            if (lives <= 0) {
              isPlaying = false;
              endTitle.textContent = "GAME OVER";
              endTitle.style.color = "#f87171";
              finalScoreEl.textContent = score;
              gameOverOverlay.classList.remove('hidden');
              return;
            } else {
              ballStuck = true;
            }
          }
        }

        collisionDetection();
      }

      // Draw everything
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawBricks();
      drawBall();
      drawPaddle();

      animId = requestAnimationFrame(update);
    }

    function startGame() {
      score = 0;
      lives = 3;
      stage = 1;
      scoreEl.textContent = '0';
      livesEl.textContent = '3';
      stageEl.textContent = '1';
      ballDx = 3.5;
      ballDy = -3.5;
      ballStuck = true;
      paddleX = (canvas.width - paddleWidth) / 2;
      initBricks();
      isPlaying = true;
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      cancelAnimationFrame(animId);
      update();
    }

    startBtn.onclick = startGame;
    restartBtn.onclick = startGame;

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const relativeX = e.clientX - rect.left;
      if (relativeX > 0 && relativeX < canvas.width) {
        paddleX = Math.max(0, Math.min(canvas.width - paddleWidth, relativeX - paddleWidth / 2));
      }
    });

    window.addEventListener('click', () => {
      if (isPlaying && ballStuck) ballStuck = false;
    });

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') {
        paddleX = Math.max(0, paddleX - 25);
      } else if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') {
        paddleX = Math.min(canvas.width - paddleWidth, paddleX + 25);
      } else if (e.key === ' ' && isPlaying && ballStuck) {
        ballStuck = false;
        e.preventDefault();
      }
    });

    initBricks();
    ctx.fillStyle = '#020617';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawBricks();
  </script>
</body>
</html>
