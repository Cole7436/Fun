<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Glide</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 16px;
    }
    .game-card {
      position: relative;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
    }
    .val {
      color: #10b981;
      font-family: monospace;
      font-size: 18px;
    }
    canvas {
      background: #042f2e;
      border-radius: 8px;
      border: 1px solid #115e59;
      display: block;
    }
    .hint {
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    .overlay {
      position: absolute;
      inset: 60px 16px 45px 16px;
      background: rgba(4, 47, 46, 0.92);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      gap: 12px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #10b981;
      color: #022c22;
      font-weight: 700;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #34d399; }
  </style>
</head>
<body>
  <div class="game-card">
    <div class="top-bar">
      <div>SCORE: <span id="score" class="val">0</span></div>
      <div>BEST: <span id="highScore" class="val">0</span></div>
    </div>

    <canvas id="canvas" width="360" height="460"></canvas>

    <div class="hint">
      <span>Jump: <b>Space</b> or <b>Click</b> / <b>Tap</b></span>
    </div>

    <div id="startOverlay" class="overlay">
      <h2 style="font-size: 24px; color: #34d399; margin-bottom: 4px;">FLAPPY GLIDE</h2>
      <p style="color: #99f6e4; font-size: 13px;">Fly between the energy towers without touching.</p>
      <button id="startBtn" class="btn">TAKE FLIGHT</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
      <h2 style="font-size: 22px; color: #f87171; margin-bottom: 4px;">CRASHED!</h2>
      <p style="color: #cbd5e1; font-size: 14px;">Score: <span id="finalScore" style="color:#34d399; font-weight:bold;">0</span></p>
      <button id="restartBtn" class="btn" style="margin-top: 8px;">TRY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let birdY = canvas.height / 2;
    let birdVelocity = 0;
    const gravity = 0.32;
    const jump = -6.5;
    const birdX = 60;
    const birdRadius = 12;

    let pipes = [];
    let pipeWidth = 44;
    let pipeGap = 125;
    let pipeSpeed = 2.4;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('flappy_best') || '0', 10);
    highScoreEl.textContent = highScore;

    let isPlaying = false;
    let animId = null;

    let audioCtx = null;
    function beep(f, dur = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(f, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function spawnPipe() {
      const topHeight = Math.floor(Math.random() * (canvas.height - pipeGap - 80)) + 40;
      pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: topHeight + pipeGap,
        passed: false
      });
    }

    function update() {
      if (!isPlaying) return;

      birdVelocity += gravity;
      birdY += birdVelocity;

      // Pipe movement
      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= pipeSpeed;

        // Check if bird passed pipe
        if (!p.passed && p.x + pipeWidth < birdX) {
          p.passed = true;
          score++;
          scoreEl.textContent = score;
          beep(600, 0.07);
          if (score > highScore) {
            highScore = score;
            highScoreEl.textContent = highScore;
            localStorage.setItem('flappy_best', highScore);
          }
        }

        // Pipe collision
        if (
          birdX + birdRadius > p.x &&
          birdX - birdRadius < p.x + pipeWidth &&
          (birdY - birdRadius < p.top || birdY + birdRadius > p.bottom)
        ) {
          endGame();
          return;
        }

        if (p.x < -pipeWidth) {
          pipes.splice(i, 1);
        }
      }

      // Ground or ceiling collision
      if (birdY + birdRadius >= canvas.height || birdY - birdRadius <= 0) {
        endGame();
        return;
      }

      // Add pipes periodically
      if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 160) {
        spawnPipe();
      }

      draw();
      animId = requestAnimationFrame(update);
    }

    function draw() {
      // Background gradient
      const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bg.addColorStop(0, '#042f2e');
      bg.addColorStop(1, '#0f766e');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Pipes
      pipes.forEach(p => {
        ctx.fillStyle = '#10b981';
        ctx.strokeStyle = '#065f46';
        ctx.lineWidth = 3;

        // Top pipe
        ctx.fillRect(p.x, 0, pipeWidth, p.top);
        ctx.strokeRect(p.x, 0, pipeWidth, p.top);

        // Bottom pipe
        const bHeight = canvas.height - p.bottom;
        ctx.fillRect(p.x, p.bottom, pipeWidth, bHeight);
        ctx.strokeRect(p.x, p.bottom, pipeWidth, bHeight);
      });

      // Bird
      ctx.save();
      ctx.translate(birdX, birdY);
      const angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, birdVelocity * 0.08));
      ctx.rotate(angle);

      // Bird Body
      ctx.fillStyle = '#fbbf24';
      ctx.shadowColor = '#f59e0b';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(0, 0, birdRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Beak
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(birdRadius - 2, -4);
      ctx.lineTo(birdRadius + 7, 0);
      ctx.lineTo(birdRadius - 2, 4);
      ctx.closePath();
      ctx.fill();

      // Eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(3, -4, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(4, -4, 1.8, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function flap() {
      if (!isPlaying) return;
      birdVelocity = jump;
      beep(380, 0.05);
    }

    function endGame() {
      isPlaying = false;
      beep(150, 0.3);
      finalScoreEl.textContent = score;
      gameOverOverlay.classList.remove('hidden');
    }

    function startGame() {
      score = 0;
      birdY = canvas.height / 2;
      birdVelocity = 0;
      pipes = [];
      scoreEl.textContent = '0';
      isPlaying = true;
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      cancelAnimationFrame(animId);
      spawnPipe();
      update();
    }

    startBtn.onclick = startGame;
    restartBtn.onclick = startGame;

    window.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'ArrowUp') {
        flap();
        e.preventDefault();
      }
    });

    canvas.addEventListener('mousedown', flap);

    draw();
  </script>
</body>
</html>
