<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Minesweeper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 16px;
    }
    .game-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .hud {
      background: #1e293b;
      border-radius: 8px;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .lcd {
      background: #030712;
      color: #ef4444;
      font-family: monospace;
      font-size: 24px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #374151;
      min-width: 60px;
      text-align: center;
    }
    .face-btn {
      font-size: 22px;
      background: #334155;
      border: none;
      border-radius: 6px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }
    .face-btn:hover { background: #475569; }
    .face-btn:active { transform: scale(0.95); }
    .board {
      display: grid;
      gap: 3px;
      background: #1e293b;
      padding: 4px;
      border-radius: 8px;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #334155;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .cell:hover:not(.revealed) {
      background: #475569;
    }
    .cell.revealed {
      background: #0b1120;
      cursor: default;
    }
    .cell.mine {
      background: #dc2626 !important;
      color: #ffffff;
    }
    .c-1 { color: #38bdf8; }
    .c-2 { color: #4ade80; }
    .c-3 { color: #f87171; }
    .c-4 { color: #818cf8; }
    .c-5 { color: #fb923c; }
    .c-6 { color: #2dd4bf; }
    .footer {
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="game-card">
    <div class="hud">
      <div class="lcd" id="mineCount">010</div>
      <button class="face-btn" id="faceBtn">🙂</button>
      <div class="lcd" id="timer">000</div>
    </div>

    <div class="board" id="board" style="grid-template-columns: repeat(9, 32px);"></div>

    <div class="footer">
      <span>Left Click: <b>Dig</b></span>
      <span>Right Click: <b>Flag 🚩</b></span>
    </div>
  </div>

  <script>
    const ROWS = 9;
    const COLS = 9;
    const MINES = 10;

    let grid = [];
    let revealedCount = 0;
    let flagsCount = 0;
    let timerVal = 0;
    let timerId = null;
    let isGameOver = false;

    const boardEl = document.getElementById('board');
    const mineCountEl = document.getElementById('mineCount');
    const timerEl = document.getElementById('timer');
    const faceBtn = document.getElementById('faceBtn');

    function pad(num, size = 3) {
      return String(num).padStart(size, '0');
    }

    function initGame() {
      clearInterval(timerId);
      timerVal = 0;
      timerEl.textContent = '000';
      timerId = null;
      isGameOver = false;
      revealedCount = 0;
      flagsCount = 0;
      faceBtn.textContent = '🙂';
      mineCountEl.textContent = pad(MINES);

      grid = [];
      boardEl.innerHTML = '';

      for (let r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) {
          const el = document.createElement('div');
          el.className = 'cell';
          el.dataset.r = r;
          el.dataset.c = c;
          boardEl.appendChild(el);

          grid[r][c] = {
            mine: false,
            revealed: false,
            flagged: false,
            count: 0,
            el
          };
        }
      }

      // Lay mines
      let placed = 0;
      while (placed < MINES) {
        const rr = Math.floor(Math.random() * ROWS);
        const cc = Math.floor(Math.random() * COLS);
        if (!grid[rr][cc].mine) {
          grid[rr][cc].mine = true;
          placed++;
        }
      }

      // Calculate neighbor counts
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!grid[r][c].mine) {
            let cnt = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr;
                const nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc].mine) {
                  cnt++;
                }
              }
            }
            grid[r][c].count = cnt;
          }
        }
      }
    }

    function startTimer() {
      if (!timerId) {
        timerId = setInterval(() => {
          timerVal = Math.min(999, timerVal + 1);
          timerEl.textContent = pad(timerVal);
        }, 1000);
      }
    }

    function revealCell(r, c) {
      if (isGameOver) return;
      const cell = grid[r][c];
      if (cell.revealed || cell.flagged) return;

      startTimer();
      cell.revealed = true;
      cell.el.classList.add('revealed');
      revealedCount++;

      if (cell.mine) {
        cell.el.classList.add('mine');
        cell.el.textContent = '💣';
        endGame(false);
        return;
      }

      if (cell.count > 0) {
        cell.el.textContent = cell.count;
        cell.el.classList.add('c-' + cell.count);
      } else {
        // Flood fill empty neighbors
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              revealCell(nr, nc);
            }
          }
        }
      }

      if (revealedCount === ROWS * COLS - MINES) {
        endGame(true);
      }
    }

    function toggleFlag(r, c) {
      if (isGameOver) return;
      const cell = grid[r][c];
      if (cell.revealed) return;

      startTimer();
      cell.flagged = !cell.flagged;
      if (cell.flagged) {
        cell.el.textContent = '🚩';
        flagsCount++;
      } else {
        cell.el.textContent = '';
        flagsCount--;
      }
      mineCountEl.textContent = pad(Math.max(0, MINES - flagsCount));
    }

    function endGame(won) {
      isGameOver = true;
      clearInterval(timerId);
      faceBtn.textContent = won ? '😎' : '😵';

      // Reveal all mines
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = grid[r][c];
          if (cell.mine && !cell.flagged) {
            cell.el.textContent = '💣';
          }
        }
      }
    }

    boardEl.addEventListener('click', e => {
      const cellEl = e.target.closest('.cell');
      if (!cellEl) return;
      const r = parseInt(cellEl.dataset.r, 10);
      const c = parseInt(cellEl.dataset.c, 10);
      revealCell(r, c);
    });

    boardEl.addEventListener('contextmenu', e => {
      e.preventDefault();
      const cellEl = e.target.closest('.cell');
      if (!cellEl) return;
      const r = parseInt(cellEl.dataset.r, 10);
      const c = parseInt(cellEl.dataset.c, 10);
      toggleFlag(r, c);
    });

    faceBtn.onclick = initGame;
    initGame();
  </script>
</body>
</html>
