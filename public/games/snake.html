<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Classic</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 16px;
    }
    .game-container {
      position: relative;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 100%;
    }
    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
    }
    .score-box {
      display: flex;
      gap: 16px;
    }
    .score-val {
      color: #10b981;
      font-family: monospace;
      font-size: 16px;
    }
    canvas {
      background: #030712;
      border-radius: 8px;
      border: 1px solid #1f2937;
      display: block;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
      max-width: 100%;
      height: auto;
    }
    .controls-hint {
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .overlay {
      position: absolute;
      top: 60px;
      left: 16px;
      right: 16px;
      bottom: 46px;
      background: rgba(3, 7, 18, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      gap: 12px;
    }
    .overlay.hidden {
      display: none;
    }
    .btn {
      background: #10b981;
      color: #022c22;
      font-weight: 700;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #34d399;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #334155;
      color: #f1f5f9;
      padding: 6px 14px;
      font-size: 12px;
    }
    .btn-secondary:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="header-bar">
      <div class="score-box">
        <span>SCORE: <span id="score" class="score-val">0</span></span>
        <span>BEST: <span id="highScore" class="score-val">0</span></span>
      </div>
      <div style="display:flex; gap:8px;">
        <button id="muteBtn" class="btn btn-secondary">🔊 Sound</button>
        <button id="pauseBtn" class="btn btn-secondary">⏸ Pause</button>
      </div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls-hint">
      <span>Move: <b>Arrow Keys</b> / <b>WASD</b></span>
      <span>Pause: <b>Space</b></span>
      <span>Restart: <b>R</b></span>
    </div>

    <div id="startOverlay" class="overlay">
      <h2 style="font-size: 24px; color: #10b981; margin-bottom: 4px;">SNAKE CLASSIC</h2>
      <p style="color: #94a3b8; font-size: 13px; margin-bottom: 8px;">Eat glowing food, avoid the perimeter and tail.</p>
      <button id="startBtn" class="btn">START GAME</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
      <h2 style="font-size: 22px; color: #f87171; margin-bottom: 4px;">GAME OVER</h2>
      <p style="color: #94a3b8; font-size: 14px;">Final Score: <span id="finalScore" style="color:#10b981; font-weight:bold;">0</span></p>
      <button id="restartBtn" class="btn" style="margin-top: 8px;">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const muteBtn = document.getElementById('muteBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    const GRID_SIZE = 20;
    const CELL_SIZE = canvas.width / GRID_SIZE;

    let snake = [];
    let food = { x: 5, y: 5 };
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snake_highscore') || '0', 10);
    highScoreEl.textContent = highScore;

    let gameLoop = null;
    let isPlaying = false;
    let isPaused = false;
    let soundEnabled = true;

    // Web Audio Synthesizer
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTone(freq, duration, type = 'sine') {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    muteBtn.onclick = () => {
      soundEnabled = !soundEnabled;
      muteBtn.textContent = soundEnabled ? '🔊 Sound' : '🔇 Muted';
    };

    pauseBtn.onclick = togglePause;

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1;
      dy = 0;
      nextDx = 1;
      nextDy = 0;
      score = 0;
      scoreEl.textContent = '0';
      spawnFood();
      isPaused = false;
      pauseBtn.textContent = '⏸ Pause';
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        const fx = Math.floor(Math.random() * GRID_SIZE);
        const fy = Math.floor(Math.random() * GRID_SIZE);
        valid = !snake.some(segment => segment.x === fx && segment.y === fy);
        if (valid) {
          food = { x: fx, y: fy };
        }
      }
    }

    function update() {
      if (!isPlaying || isPaused) return;

      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('snake_highscore', highScore);
        }
        playTone(587.33, 0.1, 'sine'); // D5
        setTimeout(() => playTone(880, 0.12, 'triangle'), 60);
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Background grid
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += CELL_SIZE) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw Food
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(
        food.x * CELL_SIZE + CELL_SIZE / 2,
        food.y * CELL_SIZE + CELL_SIZE / 2,
        CELL_SIZE / 2 - 2,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.shadowBlur = 0;

      // Draw Snake
      snake.forEach((segment, idx) => {
        if (idx === 0) {
          ctx.fillStyle = '#34d399'; // Head
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 6;
        } else {
          ctx.fillStyle = '#059669'; // Body
          ctx.shadowBlur = 0;
        }

        ctx.fillRect(
          segment.x * CELL_SIZE + 1,
          segment.y * CELL_SIZE + 1,
          CELL_SIZE - 2,
          CELL_SIZE - 2
        );
      });
      ctx.shadowBlur = 0;
    }

    function gameOver() {
      isPlaying = false;
      clearInterval(gameLoop);
      playTone(180, 0.35, 'sawtooth');
      finalScoreEl.textContent = score;
      gameOverOverlay.classList.remove('hidden');
    }

    function startGame() {
      initAudio();
      resetGame();
      isPlaying = true;
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      draw();
      clearInterval(gameLoop);
      gameLoop = setInterval(update, 110);
    }

    function togglePause() {
      if (!isPlaying) return;
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? '▶ Resume' : '⏸ Pause';
    }

    startBtn.onclick = startGame;
    restartBtn.onclick = startGame;

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'arrowup' || key === 'w') {
        if (dy !== 1) { nextDx = 0; nextDy = -1; }
        e.preventDefault();
      } else if (key === 'arrowdown' || key === 's') {
        if (dy !== -1) { nextDx = 0; nextDy = 1; }
        e.preventDefault();
      } else if (key === 'arrowleft' || key === 'a') {
        if (dx !== 1) { nextDx = -1; nextDy = 0; }
        e.preventDefault();
      } else if (key === 'arrowright' || key === 'd') {
        if (dx !== -1) { nextDx = 1; nextDy = 0; }
        e.preventDefault();
      } else if (key === ' ' || key === 'spacebar') {
        togglePause();
        e.preventDefault();
      } else if (key === 'r') {
        startGame();
      }
    });

    draw();
  </script>
</body>
</html>
