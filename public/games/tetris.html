<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Blast / Tetris</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 16px;
    }
    .game-wrapper {
      position: relative;
      display: flex;
      gap: 16px;
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    canvas#board {
      background: #030712;
      border: 1px solid #1f2937;
      border-radius: 8px;
      display: block;
    }
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 130px;
    }
    .box {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .box-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .box-value {
      font-size: 18px;
      font-family: monospace;
      font-weight: bold;
      color: #38bdf8;
    }
    canvas#preview {
      background: #030712;
      border-radius: 6px;
      margin-top: 4px;
    }
    .btn {
      background: #38bdf8;
      color: #082f49;
      font-weight: bold;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }
    .btn:hover {
      background: #7dd3fc;
    }
    .btn-secondary {
      background: #334155;
      color: #f1f5f9;
      font-size: 12px;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .instructions {
      font-size: 11px;
      color: #64748b;
      line-height: 1.4;
      margin-top: auto;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.9);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      gap: 12px;
      z-index: 10;
    }
    .overlay.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <canvas id="board" width="240" height="480"></canvas>

    <div class="side-panel">
      <div class="box">
        <span class="box-title">NEXT</span>
        <canvas id="preview" width="80" height="80"></canvas>
      </div>
      <div class="box">
        <span class="box-title">SCORE</span>
        <span id="score" class="box-value">0</span>
      </div>
      <div class="box">
        <span class="box-title">LINES</span>
        <span id="lines" class="box-value">0</span>
      </div>
      <div class="box">
        <span class="box-title">LEVEL</span>
        <span id="level" class="box-value">1</span>
      </div>
      
      <button id="pauseBtn" class="btn btn-secondary">⏸ Pause</button>
      <button id="restartBtn" class="btn btn-secondary">↺ Restart</button>

      <div class="instructions">
        <p>←/→: Move</p>
        <p>↑: Rotate</p>
        <p>↓: Soft Drop</p>
        <p>Space: Hard Drop</p>
      </div>
    </div>

    <div id="startOverlay" class="overlay">
      <h2 style="font-size: 24px; color: #38bdf8; margin-bottom: 4px;">BLOCK BLAST</h2>
      <p style="color: #94a3b8; font-size: 13px; margin-bottom: 8px;">Stack and clear horizontal rows.</p>
      <button id="startBtn" class="btn" style="padding: 10px 24px;">PLAY NOW</button>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
      <h2 style="font-size: 22px; color: #f87171; margin-bottom: 4px;">GAME OVER</h2>
      <p style="color: #94a3b8; font-size: 13px;">Final Score: <span id="finalScore" style="color:#38bdf8; font-weight:bold;">0</span></p>
      <button id="playAgainBtn" class="btn" style="margin-top: 8px; padding: 10px 20px;">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const board = document.getElementById('board');
    const ctx = board.getContext('2d');
    const preview = document.getElementById('preview');
    const pctx = preview.getContext('2d');

    const scoreEl = document.getElementById('score');
    const linesEl = document.getElementById('lines');
    const levelEl = document.getElementById('level');
    const finalScoreEl = document.getElementById('finalScore');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const playAgainBtn = document.getElementById('playAgainBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const restartBtn = document.getElementById('restartBtn');

    const COLS = 10;
    const ROWS = 20;
    const BLOCK_SIZE = 24;

    const SHAPES = [
      { color: '#06b6d4', shape: [[1, 1, 1, 1]] }, // I
      { color: '#eab308', shape: [[1, 1], [1, 1]] }, // O
      { color: '#a855f7', shape: [[0, 1, 0], [1, 1, 1]] }, // T
      { color: '#22c55e', shape: [[0, 1, 1], [1, 1, 0]] }, // S
      { color: '#ef4444', shape: [[1, 1, 0], [0, 1, 1]] }, // Z
      { color: '#3b82f6', shape: [[1, 0, 0], [1, 1, 1]] }, // J
      { color: '#f97316', shape: [[0, 0, 1], [1, 1, 1]] }  // L
    ];

    let grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    let currentPiece = null;
    let nextPiece = null;
    let currentX = 0;
    let currentY = 0;

    let score = 0;
    let lines = 0;
    let level = 1;
    let isGameOver = false;
    let isPaused = false;
    let dropInterval = 800;
    let lastDropTime = 0;
    let animFrame = null;

    let audioCtx = null;
    function beep(freq, duration = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function getRandomPiece() {
      const item = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      return {
        shape: item.shape.map(r => [...r]),
        color: item.color
      };
    }

    function rotate(matrix) {
      return matrix[0].map((_, i) => matrix.map(row => row[i]).reverse());
    }

    function canMove(shape, offsetX, offsetY) {
      for (let r = 0; r < shape.length; r++) {
        for (let c = 0; c < shape[r].length; c++) {
          if (shape[r][c]) {
            const x = offsetX + c;
            const y = offsetY + r;
            if (x < 0 || x >= COLS || y >= ROWS) return false;
            if (y >= 0 && grid[y][x]) return false;
          }
        }
      }
      return true;
    }

    function mergePiece() {
      currentPiece.shape.forEach((row, r) => {
        row.forEach((cell, c) => {
          if (cell) {
            const y = currentY + r;
            const x = currentX + c;
            if (y >= 0) grid[y][x] = currentPiece.color;
          }
        });
      });
      beep(220, 0.05);
      clearLines();
      spawnNext();
    }

    function clearLines() {
      let linesCleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r].every(c => c !== 0)) {
          grid.splice(r, 1);
          grid.unshift(Array(COLS).fill(0));
          linesCleared++;
          r++;
        }
      }
      if (linesCleared > 0) {
        lines += linesCleared;
        const linePoints = [0, 100, 300, 500, 800];
        score += linePoints[linesCleared] * level;
        level = Math.floor(lines / 10) + 1;
        dropInterval = Math.max(120, 800 - (level - 1) * 65);

        scoreEl.textContent = score;
        linesEl.textContent = lines;
        levelEl.textContent = level;

        beep(523.25, 0.1);
        setTimeout(() => beep(659.25, 0.12), 80);
      }
    }

    function spawnNext() {
      currentPiece = nextPiece || getRandomPiece();
      nextPiece = getRandomPiece();
      currentX = Math.floor((COLS - currentPiece.shape[0].length) / 2);
      currentY = 0;

      if (!canMove(currentPiece.shape, currentX, currentY)) {
        isGameOver = true;
        cancelAnimationFrame(animFrame);
        finalScoreEl.textContent = score;
        gameOverOverlay.classList.remove('hidden');
        beep(140, 0.4);
      }
      drawPreview();
    }

    function drawBlock(c, x, y, color) {
      c.fillStyle = color;
      c.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
      c.strokeStyle = '#0f172a';
      c.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
      c.fillStyle = 'rgba(255, 255, 255, 0.15)';
      c.fillRect(x * BLOCK_SIZE + 2, y * BLOCK_SIZE + 2, BLOCK_SIZE - 4, 3);
    }

    function draw() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, board.width, board.height);

      // Grid background lines
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 1;
      for (let x = 0; x <= board.width; x += BLOCK_SIZE) {
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x, board.height);
        ctx.stroke();
      }
      for (let y = 0; y <= board.height; y += BLOCK_SIZE) {
        ctx.beginPath();
        ctx.moveTo(0, y); ctx.lineTo(board.width, y);
        ctx.stroke();
      }

      // Draw grid blocks
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c]) {
            drawBlock(ctx, c, r, grid[r][c]);
          }
        }
      }

      // Draw active piece
      if (currentPiece && !isGameOver) {
        // Ghost Piece
        let ghostY = currentY;
        while (canMove(currentPiece.shape, currentX, ghostY + 1)) {
          ghostY++;
        }
        currentPiece.shape.forEach((row, r) => {
          row.forEach((cell, c) => {
            if (cell) {
              ctx.strokeStyle = 'rgba(255,255,255,0.2)';
              ctx.strokeRect((currentX + c) * BLOCK_SIZE, (ghostY + r) * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            }
          });
        });

        currentPiece.shape.forEach((row, r) => {
          row.forEach((cell, c) => {
            if (cell) {
              drawBlock(ctx, currentX + c, currentY + r, currentPiece.color);
            }
          });
        });
      }
    }

    function drawPreview() {
      pctx.fillStyle = '#030712';
      pctx.fillRect(0, 0, preview.width, preview.height);
      if (!nextPiece) return;

      const pSize = 16;
      const ox = (preview.width - nextPiece.shape[0].length * pSize) / 2;
      const oy = (preview.height - nextPiece.shape.length * pSize) / 2;

      nextPiece.shape.forEach((row, r) => {
        row.forEach((cell, c) => {
          if (cell) {
            pctx.fillStyle = nextPiece.color;
            pctx.fillRect(ox + c * pSize, oy + r * pSize, pSize, pSize);
            pctx.strokeStyle = '#0f172a';
            pctx.strokeRect(ox + c * pSize, oy + r * pSize, pSize, pSize);
          }
        });
      });
    }

    function gameLoop(time = 0) {
      if (!isGameOver && !isPaused) {
        if (time - lastDropTime > dropInterval) {
          if (canMove(currentPiece.shape, currentX, currentY + 1)) {
            currentY++;
          } else {
            mergePiece();
          }
          lastDropTime = time;
        }
        draw();
      }
      if (!isGameOver) {
        animFrame = requestAnimationFrame(gameLoop);
      }
    }

    function resetGame() {
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      score = 0;
      lines = 0;
      level = 1;
      scoreEl.textContent = '0';
      linesEl.textContent = '0';
      levelEl.textContent = '1';
      dropInterval = 800;
      isGameOver = false;
      isPaused = false;
      pauseBtn.textContent = '⏸ Pause';
      nextPiece = getRandomPiece();
      spawnNext();
    }

    function startGame() {
      resetGame();
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      lastDropTime = performance.now();
      cancelAnimationFrame(animFrame);
      animFrame = requestAnimationFrame(gameLoop);
    }

    startBtn.onclick = startGame;
    playAgainBtn.onclick = startGame;
    restartBtn.onclick = startGame;
    pauseBtn.onclick = () => {
      if (isGameOver) return;
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? '▶ Resume' : '⏸ Pause';
    };

    window.addEventListener('keydown', (e) => {
      if (isGameOver || isPaused || !currentPiece) return;

      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') {
        if (canMove(currentPiece.shape, currentX - 1, currentY)) {
          currentX--;
          beep(300, 0.03);
          draw();
        }
        e.preventDefault();
      } else if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') {
        if (canMove(currentPiece.shape, currentX + 1, currentY)) {
          currentX++;
          beep(300, 0.03);
          draw();
        }
        e.preventDefault();
      } else if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') {
        if (canMove(currentPiece.shape, currentX, currentY + 1)) {
          currentY++;
          score += 1;
          scoreEl.textContent = score;
          draw();
        }
        e.preventDefault();
      } else if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') {
        const rotated = rotate(currentPiece.shape);
        if (canMove(rotated, currentX, currentY)) {
          currentPiece.shape = rotated;
          beep(440, 0.04);
          draw();
        }
        e.preventDefault();
      } else if (e.key === ' ') {
        while (canMove(currentPiece.shape, currentX, currentY + 1)) {
          currentY++;
          score += 2;
        }
        scoreEl.textContent = score;
        mergePiece();
        draw();
        e.preventDefault();
      }
    });

    draw();
  </script>
</body>
</html>
